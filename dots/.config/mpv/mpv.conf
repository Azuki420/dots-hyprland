## Gandhi-sans ##
[gandhi-sans]
sub-ass-override=force
sub-font="Gandhi Sans PL ExtraBold"
sub-font-size=48 # 50
sub-bold=yes
sub-border-size=2.4
sub-shadow-offset=1
sub-shadow-color="#66000000"
##sub-pos=100

## Aller ##
[aller]
sub-ass-override=force
sub-font="Aller"
sub-font-size=45
sub-bold=yes
sub-border-size=2.5
sub-shadow-color=0/0/0/1
sub-shadow-offset=1.5 ## 1.2 mine
sub-pos=102
sub-ass-force-style=ScaledBorderAndShadow=no,PlayResX=1280,PlayResY=720

## Asap ##
[asap]
sub-ass-override=force
sub-font="Asap Medium"
sub-font-size=45
sub-bold=yes
sub-border-size=2.8
sub-shadow-color="#66000000"
sub-shadow-offset=1
##sub-pos=100

## Horrible Subs ##
[open-sans]
sub-ass-override=force
sub-font="Open Sans Semibold"
sub-font-size=54
sub-color="#FFFFFFFF"
sub-bold=yes
sub-border-size=2.5
sub-shadow-color=0/0/0/1
sub-shadow-offset=0
##sub-pos=100

## Netflix ##
[netflix]
sub-ass-override=force
sub-font="NetflixSans-Bold"
sub-font-size=40
sub-blur=0.95
sub-bold=yes
sub-border-size=0.1
sub-border-color='#000000'
sub-shadow-offset=0
sub-ass-force-style=Kerning=yes
#sub-pos=91

[normal]
sub-ass-override=no
sub-back-color="#00000000"
sub-border-color="#FF000000"
sub-pos=100
##sub-ass-force-style=ScaledBorderAndShadow=yes
sub-ass-force-style=""

[default]
sub-ass-override=no
sub-auto=fuzzy
sub-file-paths=Napisy
secondary-sub-visibility=no
secondary-sid=no
sub-clear-on-seek=yes

profile=netflix

## OSD ##
osd-msg3=${playback-time/full} / ${duration} (${percent-pos}%)\nframe: ${estimated-frame-number} / ${estimated-frame-count}
osd-font="Open Sans Semibold"
osd-font-size=30
osd-bold=yes
osd-border-size=2.4
osd-shadow-offset=1
osd-shadow-color="#66000000"

autofit-larger=88%
keep-open=yes
osc=no

drag-and-drop=replace

## Video ##
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
hdr-peak-percentile=99.995
hdr-contrast-recovery=0.30

#HDR
tone-mapping=mobius
hdr-compute-peak=yes
hdr-peak-percentile=99.995
hdr-contrast-recovery=0.30

## Audio ##
volume=30
volume-max=150
audio-pitch-correction=no

## Interpolation ##
video-sync=display-resample
interpolation=yes
tscale=box
tscale-window=sphinx
tscale-radius=1.01
tscale-clamp=0.0

## Screenshots ##
screenshot-format=png
screenshot-png-filter=0   
screenshot-directory="C:\Screenshot"
screenshot-template="%f (%wH.%wM.%wS)"

## Stream ##
demuxer-readahead-secs=30
demuxer-max-bytes=512MiB
demuxer-max-back-bytes=256MiB

## YouTube ##
[protocol.https]
force-window=immediate
ytdl-format=bestvideo[height<=?1080]+bestaudio/best
demuxer-max-bytes=2048MiB
demuxer-max-back-bytes=1024MiB
